<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="icon" href="{{ url_for('static', filename='brand/zc_logo_primary.svg') }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='brand/zc_logo_primary.png') }}">
  <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
  <style>
    body {
      background-color: #14181d;
      color: #dee2e6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .shot {
      max-width: 100%;
      height: auto;
      border-radius: .5rem;
    }
    .brand-logo { height: 34px; width: auto; }
    a { color: #6ea8fe; }
  </style>
</head>

<body>
  <header class="container py-3 d-flex align-items-center gap-3 flex-wrap">
    <img src="{{ url_for('static', filename='brand/zc_logo_big.svg') }}" alt="zeroCAM"
         class="brand-logo bg-light rounded px-2 py-1">
    <span class="fs-5">{{ title }}</span>
    <a class="ms-auto text-secondary text-decoration-none" href="{{ url_for('index') }}"
       title="Console di amministrazione">
      <!-- Un lucchetto e nient'altro: chi amministra sa cos'e', gli altri
           trovano una porta chiusa invece di un invito -->
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 16 16" fill="currentColor">
        <path d="M8 1a3 3 0 0 0-3 3v3H4.5A1.5 1.5 0 0 0 3 8.5v5A1.5 1.5 0 0 0 4.5 15h7a1.5 1.5 0 0 0 1.5-1.5v-5A1.5 1.5 0 0 0 11.5 7H11V4a3 3 0 0 0-3-3m2 6H6V4a2 2 0 1 1 4 0z"/>
      </svg>
    </a>
  </header>

  <main class="container flex-grow-1">
    <img id="shot" class="shot w-100" src="{{ url_for('public_image') }}" alt="{{ title }}">
    <p class="mt-3 mb-0 text-secondary small">
      Ultimo scatto: <span id="quando">—</span>
      {% if live_url %}
        &middot; <a href="{{ live_url }}" target="_blank" rel="noopener">Guarda la diretta</a>
      {% endif %}
    </p>
  </main>

  <footer class="container py-3 text-secondary small">
    Immagini prodotte da zeroCAM. La pagina si aggiorna da sola.
  </footer>

  <script>
    // Solo lettura: si chiede lo stato, si ricarica l'immagine. Il parametro
    // in coda serve a scavalcare la cache del browser, che altrimenti
    // continuerebbe a mostrare lo scatto gia' scaricato.
    async function aggiorna() {
      try {
        const res = await fetch('{{ url_for("public_info") }}', { cache: 'no-store' });
        const data = await res.json();
        if (data.captured_at) {
          document.getElementById('quando').textContent =
            new Date(data.captured_at * 1000).toLocaleString();
        }
        document.getElementById('shot').src =
          '{{ url_for("public_image") }}?t=' + Math.floor(data.captured_at || 0);
      } catch (e) {
        // Una webcam irraggiungibile per un minuto non deve svuotare la pagina
      }
    }
    aggiorna();
    setInterval(aggiorna, {{ refresh_seconds }} * 1000);
  </script>
</body>

</html>
