name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Archive release assets
        id: archive
        run: git archive -o zeroCam_${{ github.ref_name }}.zip HEAD

      # Il manuale viaggia come allegato della release, non dentro l'archivio
      # dell'applicazione: sul dispositivo non serve e peserebbe soltanto.
      - name: Install manual toolchain
        run: |
          sudo apt-get update
          # lmodern va chiesto per nome: il template di pandoc lo carica sempre,
          # ma con --no-install-recommends non arriva come dipendenza di TeX Live.
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-xetex texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended lmodern python3-pil

      - name: Build manual
        env:
          MANUAL_VERSION: ${{ github.ref_name }}
        run: |
          ./doc/build.sh
          mv doc/zeroCAM-manuale.pdf zeroCAM-manuale_${{ github.ref_name }}.pdf

      # Pacco meccanico: STEP, file di stampa e istruzioni. Creato solo quando
      # c'e' davvero qualcosa da spedire, cosi' finche' il CAD non e' pronto la
      # release non porta un allegato vuoto.
      - name: Package hardware files
        run: |
          if [ -n "$(find hardware/step hardware/print -type f ! -name '.gitkeep' 2>/dev/null)" ]; then
            zip -r zeroCam-hardware_${{ github.ref_name }}.zip \
              hardware/step hardware/print hardware/img \
              hardware/README.md hardware/CHANGELOG.md -x '*/.gitkeep'
          else
            echo "Nessun file meccanico da allegare."
          fi

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          fail_on_unmatched_files: false
          files: |
            zeroCam_${{ github.ref_name }}.zip
            zeroCAM-manuale_${{ github.ref_name }}.pdf
            zeroCam-hardware_${{ github.ref_name }}.zip
          body: "Release ${{ github.ref_name }}"
          draft: false
          prerelease: false

